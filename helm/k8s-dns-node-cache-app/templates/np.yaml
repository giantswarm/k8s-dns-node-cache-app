{{- if .Values.ciliumNetworkPolicy.enabled }}
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  namespace: {{ .Values.namespace }}
  name: {{ .Values.name }}
  labels:
    {{- include "labels.common" . | nindent 4 }}
spec:
  endpointSelector:
    matchLabels:
      {{- include "labels.selector" . | nindent 6 }}
  egress:
  {{- with .Values.ciliumNetworkPolicy.egress }}
    {{- toYaml . | nindent 4 }}
  {{- else }}
    # Forwards every query it cannot answer from its cache to the cluster DNS pods.
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: {{ .Values.namespace }}
            k8s-app: {{ .Values.upstreamService.appName }}
      toPorts:
        - ports:
            - port: {{ .Values.upstreamService.podPort | quote }}
              protocol: UDP
            - port: {{ .Values.upstreamService.podPort | quote }}
              protocol: TCP
  {{- end }}
  ingress:
  {{- with .Values.ciliumNetworkPolicy.ingress }}
    {{- toYaml . | nindent 4 }}
  {{- else }}
    # Pods and the host on the node resolve names through the local cache.
    - fromEntities:
        - all
      toPorts:
        - ports:
            - port: {{ .Values.upstreamService.servicePort | quote }}
              protocol: UDP
            - port: {{ .Values.upstreamService.servicePort | quote }}
              protocol: TCP
    - fromEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: kube-system
            app.kubernetes.io/name: alloy
            app.kubernetes.io/instance: alloy-metrics
      toPorts:
        - ports:
            - port: {{ .Values.ports.prometheus.coredns | quote }}
              protocol: TCP
  {{- end }}
{{- else }}
kind: NetworkPolicy
apiVersion: networking.k8s.io/v1
metadata:
  namespace: {{ .Values.namespace }}
  name: {{ .Values.name }}
  labels:
    {{- include "labels.common" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "labels.selector" . | nindent 6 }}
  ingress:
  - ports:
    - port: {{ .Values.upstreamService.servicePort }}
      protocol: UDP
    - port: {{ .Values.upstreamService.servicePort }}
      protocol: TCP
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: kube-system
      podSelector:
        matchLabels:
          app.kubernetes.io/name: alloy
          app.kubernetes.io/instance: alloy-metrics
    ports:
    - port: {{ .Values.ports.prometheus.coredns }}
      protocol: TCP
  egress:
  - to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: {{ .Values.namespace }}
      podSelector:
        matchLabels:
          k8s-app: {{ .Values.upstreamService.appName }}
    ports:
    - port: {{ .Values.upstreamService.podPort }}
      protocol: UDP
    - port: {{ .Values.upstreamService.podPort }}
      protocol: TCP
  policyTypes:
  - Egress
  - Ingress
{{- end }}
