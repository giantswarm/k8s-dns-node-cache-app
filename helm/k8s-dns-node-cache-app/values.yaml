# Default values for name: k8s-dns-node-cache-chart
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

name: k8s-dns-node-cache
namespace: kube-system
serviceType: managed

image:
  registry: gsoci.azurecr.io
  name: giantswarm/k8s-dns-node-cache
  tag: 1.26.7

updateStrategy:  # @schema skipProperties: true; additionalProperties: true
  rollingUpdate:
    maxUnavailable: 10%

cluster:
  kubernetes:
    DNS:
      IP: 172.31.0.10
      serviceName: coredns
    LOCAL:
      IP: 169.254.20.10
    clusterDomain: cluster.local

ports:
  prometheus:
    nodecache: 9253
    coredns: 9254
  liveness: 8080

# Reference of the traditional coredns pods.
upstreamService:
  # The port the traditional coredns service is listening to.
  servicePort: 53
  # The port the traditional coredns pods are listening to.
  podPort: 1053
  # The value of the `k8s-app` label for the traditional coredns pods.
  appName: coredns

resources:  # @schema skipProperties: true; additionalProperties: true
  requests:
    cpu: 50m
    memory: 100Mi

configmap:
  cache:
    success: 30
    denial: 5
  noAAAAResponse: true
  log:
    enabled: false

ciliumNetworkPolicy:
  # -- Render a CiliumNetworkPolicy. When false, a plain NetworkPolicy is rendered instead.
  enabled: true
  # @schema item: object; itemAdditionalProperties: true
  # -- Replaces the default CiliumNetworkPolicy egress rules when set.
  egress: []
  # @schema item: object; itemAdditionalProperties: true
  # -- Replaces the default CiliumNetworkPolicy ingress rules when set.
  ingress: []

ciliumLocalRedirectPolicy:
  # -- Redirect traffic for the cluster DNS Service to the node-local cache with a CiliumLocalRedirectPolicy.
  enabled: true
